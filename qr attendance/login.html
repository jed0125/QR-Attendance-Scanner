<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#12263A">
    <title>Staff login — School attendance</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2228%22%20height%3D%2228%22%20viewBox%3D%220%200%2028%2028%22%20fill%3D%22none%22%20stroke%3D%22%237FD6BE%22%20stroke-width%3D%222%22%3E%3Crect%20x%3D%223%22%20y%3D%223%22%20width%3D%228%22%20height%3D%228%22%20rx%3D%221%22%2F%3E%3Crect%20x%3D%2217%22%20y%3D%223%22%20width%3D%228%22%20height%3D%228%22%20rx%3D%221%22%2F%3E%3Crect%20x%3D%223%22%20y%3D%2217%22%20width%3D%228%22%20height%3D%228%22%20rx%3D%221%22%2F%3E%3Cpath%20d%3D%22M17%2017h3v3h-3zM22%2022h3M22%2017v2%22%2F%3E%3C%2Fsvg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/site-config.js"></script>
    <script type="module" src="js/login.js"></script>
  </head>
  <body>
    <header class="site-header" role="banner">
      <div class="site-header-inner">
        <div class="site-header-top">
          <div class="header-brand">
            <svg class="logo-mark" width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="3" y="3" width="8" height="8" rx="1"/>
              <rect x="17" y="3" width="8" height="8" rx="1"/>
              <rect x="3" y="17" width="8" height="8" rx="1"/>
              <path d="M17 17h3v3h-3zM22 22h3M22 17v2"/>
            </svg>
            <div class="header-copy">
              <span class="school-name">[SCHOOL NAME]</span>
              <h1 class="page-title" id="page-title">Staff login</h1>
            </div>
          </div>
        </div>
        <p class="subtitle">Sign in to manage student attendance and registrations.</p>
      </div>
    </header>

    <main class="login-shell">
      <section class="card login-card" aria-labelledby="login-heading">
        <h2 id="login-heading" style="margin-bottom: 6px;">Sign in</h2>
        <p style="margin-bottom: 20px; font-size: 0.9375rem;">Enter your staff account credentials.</p>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Staff email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              maxlength="253"
              required
              aria-describedby="email-error"
            >
            <p class="field-error" id="email-error"></p>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              aria-describedby="password-error"
            >
            <p class="field-error" id="password-error"></p>
          </div>

          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
          <button class="btn btn-primary btn-full" id="submit-button" type="submit">Sign in</button>
        </form>

        <div class="login-switch">
          Parent or guardian? <a href="parent-login.html" class="footer-link">Go to Parent login</a>
        </div>
      </section>

      <p class="page-footer">Your information is used for school attendance purposes.</p>
    </main>
  </body>
</html>
