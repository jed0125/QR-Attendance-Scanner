<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Login — QR Attendance</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Teacher Login</h1>
      <p class="subtitle">Sign in to manage students and scanner</p>
    </header>

    <section class="card" aria-labelledby="login-title">
      <h2 id="login-title">Sign In</h2>

      <div id="error-msg" class="error" role="alert" hidden></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-email">Email address</label>
          <input type="email" id="login-email" name="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" required autocomplete="current-password" />
        </div>
        <button type="submit" id="login-btn" class="btn btn-primary" disabled>
          <span class="btn-text">Sign In</span>
          <span class="btn-loading" hidden>Signing in…</span>
        </button>
      </form>
    </section>

    <footer>
      <p>QR Attendance System — Phase 2</p>
    </footer>
  </main>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
  <script>
    // Use the shared config from js/config.js (window.SUPABASE_URL and window.SUPABASE_ANON_KEY)
    const supabaseClient = supabaseJs.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_ANON_KEY
    );

    // Elements
    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('login-email');
    const passInput = document.getElementById('login-password');
    const errorDiv = document.getElementById('error-msg');
    const submitBtn = document.getElementById('login-btn');

    // Helpers
    function setError(text) {
      errorDiv.textContent = text;
      errorDiv.hidden = !text;
    }

    function updateButton() {
      const ok = emailInput.value.trim() && passInput.value;
      submitBtn.disabled = !ok;
    }

    // Form submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      setError('');

      submitBtn.disabled = true;
      submitBtn.querySelector('.btn-text').hidden = true;
      submitBtn.querySelector('.btn-loading').hidden = false;

      const email = emailInput.value.trim();
      const password = passInput.value;

      try {
        // Sign in
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email,
          password,
        });

        if (error) {
          throw error;
        }

        // Check if the user is a teacher (has a row in teachers table)
        const { data: teacherData, error: teacherError } = await supabaseClient
          .from('teachers')
          .select('id')
          .eq('id', data.user.id)
          .maybeSingle();

        if (!teacherData) {
          // Not a teacher, sign out and show message
          await supabaseClient.auth.signOut();
          setError('This account is not authorized to use this system.');
          return;
        }

        // Success — redirect to scanner
        window.location.href = 'scanner.html';

      } catch (err) {
        console.error('Login error:', err);
        setError(err.message || 'Sign in failed. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.querySelector('.btn-text').hidden = false;
        submitBtn.querySelector('.btn-loading').hidden = true;
      }
    });

    // Auto-update button as user types
    emailInput.addEventListener('input', updateButton);
    passInput.addEventListener('input', updateButton);
  </script>
</body>
</html>
