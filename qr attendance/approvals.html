<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#12263A">
    <title>Pending registrations — School attendance</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2228%22%20height%3D%2228%22%20viewBox%3D%220%200%2028%2028%22%20fill%3D%22none%22%20stroke%3D%22%237FD6BE%22%20stroke-width%3D%222%22%3E%3Crect%20x%3D%223%22%20y%3D%223%22%20width%3D%228%22%20height%3D%228%22%20rx%3D%221%22%2F%3E%3Crect%20x%3D%2217%22%20y%3D%223%22%20width%3D%228%22%20height%3D%228%22%20rx%3D%221%22%2F%3E%3Crect%20x%3D%223%22%20y%3D%2217%22%20width%3D%228%22%20height%3D%228%22%20rx%3D%221%22%2F%3E%3Cpath%20d%3D%22M17%2017h3v3h-3zM22%2022h3M22%2017v2%22%2F%3E%3C%2Fsvg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/site-config.js"></script>
    <script type="module" src="js/approvals.js"></script>
  </head>
  <body>
    <header class="site-header" role="banner">
      <div class="site-header-inner">
        <div class="site-header-top">
          <div class="header-brand">
            <svg class="logo-mark" width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="3" y="3" width="8" height="8" rx="1"/>
              <rect x="17" y="3" width="8" height="8" rx="1"/>
              <rect x="3" y="17" width="8" height="8" rx="1"/>
              <path d="M17 17h3v3h-3zM22 22h3M22 17v2"/>
            </svg>
            <div class="header-copy">
              <span class="school-name">[SCHOOL NAME]</span>
              <h1 class="page-title" id="page-title">Pending registrations</h1>
            </div>
          </div>
          <nav class="nav-bar" aria-label="Staff navigation"></nav>
        </div>
        <p class="subtitle">Review and approve new student registrations before their QR code is activated.</p>
      </div>
    </header>

    <main class="page-shell" id="main-content" hidden>
      <section class="approvals-section" aria-labelledby="approvals-heading">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px;">
          <h2 id="approvals-heading" style="font-size: 1.25rem;">Student registrations awaiting approval</h2>
          <button class="btn btn-secondary" id="refresh-button" type="button">Refresh</button>
        </div>

        <p class="form-message" id="status-message" role="status" aria-live="polite"></p>

        <!-- Grid of pending student cards -->
        <div id="approvals-table">
          <div class="pending-grid" id="approvals-body">
            <!-- Cards inserted by JavaScript -->
          </div>
        </div>

        <p class="empty-state card" id="empty-state" hidden style="margin-top: 16px;">No pending registrations</p>
      </section>
    </main>

    <footer class="page-footer" id="page-footer" hidden>
      Your information is used for school attendance purposes.
    </footer>
  </body>
</html>
