<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Scanner — QR Attendance</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>QR Scanner</h1>
      <p class="subtitle" id="teacher-name-sub">Teacher</p>
    </header>

    <!-- Nav bar -->
    <nav class="nav-bar" aria-label="Teacher navigation">
      <a href="scanner.html" class="nav-link active" aria-current="page">Scanner</a>
      <a href="approvals.html" class="nav-link">Approvals</a>
      <button type="button" id="nav-sign-out" class="nav-link nav-link-btn">Sign Out</button>
    </nav>

    <!-- Mode toggle -->
    <div class="card" style="margin-bottom: 16px;">
      <p class="subtitle" style="margin: 0 0 10px;">Attendance Mode</p>
      <div class="actions" style="justify-content: flex-start;">
        <button type="button" id="mode-in" class="btn btn-primary" aria-pressed="true">Time In</button>
        <button type="button" id="mode-out" class="btn btn-secondary" aria-pressed="false">Time Out</button>
      </div>
    </div>

    <!-- Camera -->
    <div class="card" style="margin-bottom: 16px;">
      <div id="camera-container">
        <div id="qr-reader" style="width: 100%; max-width: 400px; margin: 0 auto;"></div>
        <p id="camera-status" class="hint">Initializing camera…</p>
      </div>
      <div class="actions" style="margin-top: 12px;">
        <button type="button" id="toggle-camera-btn" class="btn btn-secondary">Switch Camera</button>
      </div>
    </div>

    <!-- Result card -->
    <div id="scan-result" class="card" hidden>
      <h2>Scan Result</h2>
      <div id="scan-result-content"></div>
    </div>

    <!-- Session list (today's logs) -->
    <div class="card" style="margin-top: 16px;">
      <h2>Today's Logs</h2>
      <div id="scan-list" class="scan-list empty-state">
        <p class="hint">Loading…</p>
      </div>
    </div>

    <footer>
      <p>QR Attendance System — Phase 3</p>
    </footer>
  </main>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/html5-qrcode@3.10.0" crossorigin="anonymous"></script>
  <script src="js/auth.js"></script>
  <script src="js/scanner.js"></script>
</body>
</html>
