<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration — QR Attendance</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Student Registration</h1>
      <p class="subtitle">Get your unique QR code for attendance check-in</p>
    </header>

    <!-- Registration form -->
    <section id="registration-form" class="card" aria-labelledby="form-title">
      <h2 id="form-title">Register Student</h2>
      <form id="reg-form" novalidate>
        <!-- Honeypot (hidden from humans, filled by bots) -->
        <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none;" aria-hidden="true" />

        <div class="field">
          <label for="student-name">Student Name <span class="req" aria-hidden="true">*</span></label>
          <input type="text" id="student-name" name="student_name" required autocomplete="name" maxlength="100" />
          <span class="error" id="err-student-name" aria-live="polite"></span>
        </div>

        <div class="field">
          <label for="guardian-name">Guardian Name <span class="req" aria-hidden="true">*</span></label>
          <input type="text" id="guardian-name" name="guardian_name" required autocomplete="name" maxlength="100" />
          <span class="error" id="err-guardian-name" aria-live="polite"></span>
        </div>

        <div class="field">
          <label for="guardian-phone">Guardian Phone (Philippine mobile) <span class="req" aria-hidden="true">*</span></label>
          <input type="tel" id="guardian-phone" name="guardian_phone" required autocomplete="tel"
                 placeholder="09XXXXXXXXX or +639XXXXXXXXX" maxlength="13" />
          <span class="hint">Format: 09XXXXXXXXX or +639XXXXXXXXX</span>
          <span class="error" id="err-guardian-phone" aria-live="polite"></span>
        </div>

        <div class="field checkbox-field">
          <input type="checkbox" id="consent" name="consent" required />
          <label for="consent">I confirm the guardian agreed to receive SMS attendance notifications.</label>
          <span class="error" id="err-consent" aria-live="polite"></span>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" disabled>
          <span class="btn-text">Generate QR Code</span>
          <span class="btn-loading" hidden>Generating…</span>
        </button>
      </form>
    </section>

    <!-- Result card (hidden initially) -->
    <section id="result-card" class="card" hidden aria-labelledby="result-title">
      <h2 id="result-title">Your QR Code</h2>
      <p class="success-message">Registration successful! Save or print this QR code.</p>

      <div class="qr-wrapper">
        <canvas id="qr-canvas" aria-label="QR code containing student UUID"></canvas>
        <div class="student-info" id="student-info"></div>
      </div>

      <div class="actions">
        <button type="button" id="download-btn" class="btn btn-secondary">Download PNG</button>
        <button type="button" id="print-btn" class="btn btn-secondary">Print</button>
        <button type="button" id="new-btn" class="btn btn-ghost">Register Another</button>
      </div>
    </section>
  </main>

  <footer>
    <p>QR Attendance System — Phase 1</p>
  </footer>

  <!-- QRCode library via CDN -->
  <script src="https://unpkg.com/qrcode@1.5.3/browser/qrcode.min.js" crossorigin="anonymous"></script>
  <!-- Supabase client via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
  <script src="js/app.js"></script>
</body>
</html>
